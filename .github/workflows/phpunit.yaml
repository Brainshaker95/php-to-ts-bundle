name: PHPUnit

on:
  - pull_request
  - push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: php-actions/composer@v6
      - uses: php-actions/phpunit@v4
        with:
          version: 11.5.42
          php_extensions: json mbstring xdebug xml
          coverage_text: true
        env:
          XDEBUG_MODE: coverage
